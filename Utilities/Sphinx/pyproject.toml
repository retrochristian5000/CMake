[tool.poe.tasks]
dead-check = "vulture cmake.py"
lint-check = "flakeheaven lint colors.py cmake.py cmakelexer.py test/cmakelexer_test.py"
test = "pytest"

[tool.poetry]
name = "sphinx-cmake"
version = "1.0.0"
description = "Sphinx Extension for CMake Domain"
authors = []

[tool.poetry.dependencies]
python = "^3.10"
build = "*"
flake8 = "~= 4.0"
flake8-2020 = "*"
flake8-bugbear = "*"
flake8-builtins = "*"
flake8-comprehensions = "*"
flake8-eradicate = "*"
flake8-isort = "*"
flake8-mutable = "*"
flake8-pep3101 = "*"
flake8-quotes = "*"
flake8-return = "*"
flake8-rst-docstrings = "*"
flake8-simplify = "*"
flake8-use-fstring = "*"
flake8-variables-names = "*"
flakeheaven = "*"
isort = ">= 5.4"
mccabe = "*"
mypy = "*"
poethepoet = "*"
pycodestyle = "*"
pylint = "*"
pytest = "*"
sphinx = "*"
vulture = ">= 2.3"

[tool.flakeheaven]
format = "grouped"
max_line_length = 130
show_source = true
extended_default_ignore=[]

[tool.flakeheaven.plugins]
flake8-2020 = ["+*"]
flake8-bugbear = ["+*"]
flake8-builtins = ["+*"]
flake8-comprehensions = ["+*"]
flake8-eradicate = ["+*"]
flake8-isort = ["+*"]
flake8-mutable = ["+*"]
flake8-pep3101 = ["+*"]
flake8-quotes = ["+*"]
flake8-return = ["+*"]
flake8-rst-docstrings = ["+*"]
flake8-simplify = ["+*"]
flake8-use-fstring = ["-*"]
flake8-variables-names = ["+*"]
mccabe = ["+*"]
# -E121 continuation line under-indented for hanging indent
# -E123 closing bracket does not match indentation of opening bracket's line
# -E124 closing bracket does not match visual indentation
# -E126 continuation line over-indented for hanging indent
# -E127 continuation line over-indented for visual indent
# -E131 continuation line unaligned for hanging indent
# -E203 whitespace before ','
# -E241 multiple spaces after ':'
pycodestyle = ["+*", "-E121", "-E123", "-E124", "-E126", "-E127", "-E131", "-E203", "-E241"]
pyflakes = ["+*"]
# -C0114 Missing module docstring
# -C0115 Missing class docstring
# -C0116 Missing function or method docstring
# -C0209 Formatting a regular string which could be a f-string
pylint = ["+*", "-C0114", "-C0115", "-C0116", "-C0209"]

[tool.isort]
line_length = 90
multi_line_output = 3
use_parentheses = true
combine_star = true
honor_noqa = true
import_heading_stdlib = "Standard imports"
import_heading_thirdparty = "Third party packages"
import_heading_firstparty = "Project-specific imports"
import_heading_localfolder = "Local imports"

[tool.pylint.BASIC]

[tool.pylint.FORMAT]
max-line-length = 130

[tool.pylint.LOGGING]
logging-format-style = 'new'

[tool.pylint.MISCELLANEOUS]
notes = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["test"]
python_files = ["*_test.py"]
python_classes = ["*Test"]
python_functions = ["*_test", "*_test_?", "*_test_??"]
markers = [
    "wip: work in progress"
  ]

[tool.vulture]
min_confidence = 61
