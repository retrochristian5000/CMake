include:
    # Metadata shared my many jobs
    - local: .gitlab/rules.yml
    - local: .gitlab/artifacts.yml

    # OS builds.
    - local: .gitlab/os-linux.yml
    - local: .gitlab/os-macos.yml
    - local: .gitlab/os-windows.yml

    # Post-build steps
    - local: .gitlab/upload.yml

stages:
    - prep
    - build
    - test
    - test-ext
    - upload

################################################################################
# Job declarations
#
# Each job must pull in each of the following keys:
#
#   - a "base image"
#   - a build script
#   - tags for the jobs
#   - rules for when to run the job
#
# Additionally, jobs may also contain:
#
#   - artifacts
#   - dependency/needs jobs for required jobs
################################################################################

# Prep jobs

source-package:prep:
    extends:
        - .linux_prep_source
        - .cmake_prep_source_linux
        - .linux_builder_tags
        - .cmake_release_artifacts
        - .run_only_for_package

doc-package:prep:
    extends:
        - .fedora34_sphinx_package
        - .cmake_prep_doc_linux
        - .linux_builder_tags_qt
        - .cmake_doc_artifacts
        - .run_only_for_package

upload:source-package:upload:
    extends:
        - .rsync_upload_binary
        - .run_only_for_package
    dependencies:
        - source-package:prep
    needs:
        - source-package:prep
    variables:
        RSYNC_DESTINATION: dev

# Documentation builds

help:master:build:
    extends:
        - .cmake_org_help
        - .run_only_for_continuous_master

help:master:upload:
    extends:
        - .rsync_upload_help
        - .run_only_for_continuous_master
    variables:
        RSYNC_DESTINATION: git-master
    dependencies:
        - help:master:build
    needs:
        - help:master:build

help:stage:build:
    extends:
        - .cmake_org_help
        - .run_only_for_continuous_stage

help:stage:upload:
    extends:
        - .rsync_upload_help
        - .run_only_for_continuous_stage
    variables:
        RSYNC_DESTINATION: git-stage
    dependencies:
        - help:stage:build
    needs:
        - help:stage:build

